<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Student Directory | Task 16</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#" aria-label="Student Directory home">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>student<span class="brand-accent">hub</span></span>
        </a>
        <div class="profile">
            <span class="profile-avatar" aria-hidden="true">U</span>
            <span class="profile-name">Hi, Username</span>
        </div>
    </header>

    <main class="page-content">
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">DIRECTORY</p>
            <h1 id="page-title">Find your students<span>.</span></h1>
            <p class="intro-copy">Search the directory by name, class, marks, or address.</p>
        </section>

        <form class="search-panel" id="search-form" role="search">
            <label class="search-field" for="student-search">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"></circle>
                    <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
                <input
                    id="student-search"
                    name="search"
                    type="search"
                    placeholder="Try a name, city, or class..."
                    autocomplete="off"
                    aria-controls="student-list"
                >
            </label>
            <button class="search-button" type="submit">Search</button>
            <button class="clear-button" id="clear-search" type="button" hidden>Clear</button>
        </form>

        <div class="results-heading">
            <h2>All students</h2>
            <p id="result-count" aria-live="polite"></p>
        </div>

        <section class="student-grid" id="student-list" aria-label="Students"></section>
        <div class="empty-state" id="empty-state" hidden>
            <span class="empty-icon" aria-hidden="true">⌕</span>
            <h2>No students found</h2>
            <p>Try another name, class, mark, or address.</p>
        </div>
    </main>

    <footer class="site-footer">A simple student directory <span aria-hidden="true">·</span> Task 16</footer>
    <script src="script.js"></script>
</body>
</html>
